version: 2
# No npm updates here: Dependabot does not check out submodules, so it sees the workspace without
# apps/store and apps/simulator and would rewrite pnpm-lock.yaml without their dependencies.
# Update packages by hand instead (docs/development.md, "Dependencies").
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: 'ci'
  # Opens a pull request when the store or the simulator has new commits on main.
  - package-ecosystem: gitsubmodule
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: 'chore'
